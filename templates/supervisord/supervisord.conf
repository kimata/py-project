[supervisord]
nodaemon=true
user=ubuntu
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:flask-api]
command=/home/ubuntu/.local/bin/uv run --no-group dev {{ project.get_app_name() }}-web --config config.yaml
directory=/opt/{{ project.get_app_name() }}
autostart=true
autorestart=true
startretries=3
startsecs=5
# クローラーが現在のストア処理を終えてブラウザを閉じられるよう、SIGTERM 後の猶予を長めに取る
# (k8s の terminationGracePeriodSeconds=120 より短くする)
stopwaitsecs=110
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",SSR_INTERNAL_SECRET="%(ENV_SSR_INTERNAL_SECRET)s"

[program:node-ssr]
command=node /opt/{{ project.get_app_name() }}/frontend/dist/server/server.js
directory=/opt/{{ project.get_app_name() }}
autostart=true
autorestart=true
startretries=3
startsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=NODE_ENV="production",FLASK_API_URL="http://localhost:5000",PORT="3000",SSR_INTERNAL_SECRET="%(ENV_SSR_INTERNAL_SECRET)s"
