# py-project 設定ファイル
# 複数の Python プロジェクトに標準的な設定を一括適用します

# グローバル設定（全プロジェクト共通のデフォルト）
defaults:
    python_version: "3.12"
    configs:
        - pyproject
        - python-version
        - pre-commit
        - ruff
        - gitignore
        - dockerignore
        - renovate
        - prettier
        - license
        - my-py-lib
        - gitlab-ci
        - yamllint
    vars:
        registry: "gitlab.green-rabbit.net:5050/kimata"
        ubuntu_tag: "260104_3efe597c"
        renovate_tag: "260104_3da7b77b"
        # Dockerfile テンプレートのベースイメージ（renovate は py-project 側で更新する）
        ubuntu_image: "ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90"
        node_image: "node:20-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0"
        # CI の build-react ジョブ用 node イメージ
        ci_node_image: "node:24.17@sha256:733e1c06ada118ed9f6133a31aa1290be6929664026fb28821500437c61f2c6f"
        kubectl_tag: "250715_c88f3965"
    gitlab_ci:
        edits:
            - path: /image
              value: "{{ vars.registry }}/local-ubuntu:{{ vars.ubuntu_tag }}"
            - path: /renovate/image/name
              value: "{{ vars.registry }}/local-renovate:{{ vars.renovate_tag }}"

# テンプレートディレクトリ
template_dir: ./templates

# プロジェクト一覧
projects:
    - name: my-py-lib
      path: ~/github/my-py-lib
      configs:
          - gitlab-ci-gen
      ci:
          template: library
          pyright_target: ""
          pytest_args: "tests/unit/"
          pytest_pre:
              - apt update
              - apt install --no-install-recommends --assume-yes smem
      exclude_configs:
          - my-py-lib
          - gitlab-ci
      pyproject:
          extra_dev_deps:
              - python-amazon-paapi>=6.2.0
              - flask-cors>=6.0.2
              - flask>=3.1.2
              - openpyxl>=3.1.5
              - pillow>=12.1.0
              - rpi-lgpio>=0.6
              - selenium>=4.39.0
              - spidev>=3.8
              - speechrecognition>=3.14.5
              - pydub>=0.25.1
              - pytest-forked>=1.6.0
              - pytest-rerunfailures>=16.1
              - undetected-chromedriver>=3.5.5
              - types-requests>=2.32.4

    - name: price-platform
      path: ~/github/price-platform
      configs:
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: library
          pyright_target: ""
          lint: true
          update_cache: true
      pyproject:
          preserve_fields:
              - requires-python # PEP 695 構文を使用しており 3.12 以上が必須
          preserve_sections:
              - tool.ty # unresolved-import=ignore（tweepy 等は消費側が提供する遅延 import）
          extra_dev_deps:
              - "ruff==0.12.2" # CI の test-lint で使用。pre-commit の rev と揃える
      ruff:
          extra_lines:
              - ""
              - "[lint.per-file-ignores]"
              - '"tests/**/*.py" = ["S101", "S108"]'
              - '"src/price_platform/testing/**/*.py" = ["S101"]'

    - name: pt-fleama
      path: ~/github/pt-fleama
      configs:
          - dockerfile
          - supervisord
          - docker-entrypoint
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
          - my-py-lib # my_lib は price-platform 経由の推移的依存 (pin 同時更新制約の解消)
      vars:
          ci_npm_build_script: "build:ssr"
          ci_test_db_file: "price.duckdb"
      ci:
          template: fleama
      docker:
          template: supervisor
          chrome: true
          # NOTE: Chrome 143 でレンダラープロセスが約20分後に切断される問題があるため固定
          chrome_version: "142.0.7444.175-1"
      gitignore:
          extra_lines:
              - ""
              - "# コンテンツ YAML はテンプレートの *.yaml 除外の対象外にする"
              - "!conf/about.yaml"
              - "!conf/editorial_policy.yaml"
              - "!conf/guides/*.yaml"
              - "!conf/knowledge/*.yaml"
      pyproject:
          preserve_fields:
              - requires-python # PEP 695 構文を使用しており 3.12 以上が必須
          extra_dev_deps:
              - "numpy>=2.4.2"

    - name: lens-fleama
      path: ~/github/lens-fleama
      configs:
          - dockerfile
          - supervisord
          - docker-entrypoint
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
          - my-py-lib # my_lib は price-platform 経由の推移的依存 (pin 同時更新制約の解消)
      vars:
          ci_npm_build_script: "build"
          ci_test_db_file: "price.db"
      ci:
          template: fleama
      docker:
          template: supervisor
          chrome: true
          # NOTE: Chrome 143 でレンダラープロセスが約20分後に切断される問題があるため固定
          chrome_version: "142.0.7444.175-1"
      gitignore:
          extra_lines:
              - ""
              - "# コンテンツ YAML はテンプレートの *.yaml 除外の対象外にする"
              - "!conf/about.yaml"
              - "!conf/editorial_policy.yaml"
              - "!conf/guides/*.yaml"
      pyproject:
          preserve_fields:
              - requires-python # PEP 695 構文を使用しており 3.12 以上が必須
          extra_dev_deps:
              - "numpy>=2.4.2"

    - name: hp-fleama
      path: ~/github/hp-fleama
      configs:
          - dockerfile
          - supervisord
          - docker-entrypoint
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
          - my-py-lib # my_lib は price-platform 経由の推移的依存 (pin 同時更新制約の解消)
      vars:
          ci_npm_build_script: "build"
          ci_test_db_file: "price.duckdb"
      ci:
          template: fleama
      docker:
          template: supervisor
          chrome: true
          # NOTE: Chrome 143 でレンダラープロセスが約20分後に切断される問題があるため固定
          chrome_version: "142.0.7444.175-1"
      gitignore:
          extra_lines:
              - ""
              - "# コンテンツ YAML はテンプレートの *.yaml 除外の対象外にする"
              - "!conf/about.yaml"
              - "!conf/editorial_policy.yaml"
              - "!conf/guides/*.yaml"
      pyproject:
          preserve_fields:
              - requires-python # PEP 695 構文を使用しており 3.12 以上が必須
          extra_dev_deps:
              - "numpy>=2.4.2"

    - name: price-watch
      path: ~/github/price-watch
      configs:
          - dockerfile
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: docker
          pyright_target: ""
          pytest_config_script: false
          extra_artifacts:
              - data/debug/**
          config_script:
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/bot-config.git
              - mv bot-config/price-watch.yaml config.yaml
              - mv bot-config/price-watch-target.yaml target.yaml
          webui_run:
              # テスト用のダミー価格履歴 DB を作成
              - mkdir -p test_data
              - uv run python scripts/create_test_history_db.py -o test_data/price.db
              - |-
                  docker run --rm --detach=true --tty=true
                  --name ${CI_JOB_NAME}-${CI_JOB_ID} --label job=${CI_JOB_NAME}
                  --publish :5000
                  ${CI_REGISTRY_IMAGE}:${TAG} sleep infinity
              # config.yaml の data.price 設定により異なるパスが使われる可能性があるため両方へコピー
              - docker exec ${CI_JOB_NAME}-${CI_JOB_ID} mkdir -p /opt/price-watch/data
              - docker exec ${CI_JOB_NAME}-${CI_JOB_ID} mkdir -p /opt/price-watch/data/price
              - docker cp test_data/price.db ${CI_JOB_NAME}-${CI_JOB_ID}:/opt/price-watch/data/
              - docker cp test_data/price.db ${CI_JOB_NAME}-${CI_JOB_ID}:/opt/price-watch/data/price/
              # target.yaml を削除してテスト DB のアイテムが表示されるようにする
              - docker exec ${CI_JOB_NAME}-${CI_JOB_ID} rm -f /opt/price-watch/target.yaml
              - docker exec --detach ${CI_JOB_NAME}-${CI_JOB_ID} uv run --no-group dev price-watch-webui
          webui_health_path: /price
          extra_test_jobs:
              - test-docker
          include_local: true
          deploy_script:
              - kubectl config use-context kimata/price-watch:pod-rollout
              - kubectl -n bot set image deployment/price-watch price-watch=${IMAGE}
              - kubectl -n bot rollout status deployment/price-watch --timeout=300s
      docker:
          template: standard
          chrome: true
          # NOTE: Chrome 143 でレンダラープロセスが約20分後に切断される問題があるため固定
          chrome_version: "142.0.7444.175-1"
          fonts: true
          extra_apt:
              - ffmpeg
              - smem
          cmd: ["price-watch"]

    - name: rasp-water
      path: ~/github/rasp-water
      configs:
          - dockerfile
      docker:
          template: hardware
          lgpio: true
          dev_deps: true
          expose:
              - 5000
          cmd: ["./flask/src/app.py"]
      dockerignore:
          extra_lines:
              - ""
              - "# NOTE: dist/ は Angular のビルド出力であり、Docker イメージに含める必要が"
              - "# あるため、テンプレートの除外設定を取り消す。"
              - "!dist/"
      ruff:
          extra_lines:
              - ""
              - "[lint.per-file-ignores]"
              - "# NOTE: メトリクスページは HTML テンプレートを埋め込んだ文字列で構成されており、"
              - "# 行長制限 (E501) は本質的に適用しづらいため除外する。"
              - '"**/metrics/webapi/page.py" = ["E501"]'

    - name: mercari-bot
      path: ~/github/mercari-bot
      configs:
          - dockerfile
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: docker
          frontend: false
          pytest_config_script: false
          config_script:
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/bot-config.git
              - mv bot-config/mercari-bot.yaml config.yaml
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/font.git private_font
              - mv private_font/* font
          extra_build_args:
              # Chrome は週次で最新版を取得する（キャッシュバスター）
              - --build-arg CHROME_CACHE_BUSTER=$(date +%Y%W)
          extra_test_jobs:
              - test-smoke
              - test-docker
          include_local: true
          deploy_script:
              - 'echo "OK. The CronJob references latest, so no action is needed."'
      docker:
          template: standard
          chrome: true
          fonts: true
          extra_apt:
              - smem
          cmd: ["mercari-bot", "-l"]

    - name: merhist-python
      path: ~/github/merhist-python
      ci:
          template: library
          smoke_config: merhist.yaml
          smoke_command: merhist
          extra_artifacts:
              - data/debug/**
      configs:
          - dockerfile
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      docker:
          template: standard
          app_name: merhist
          chrome: true
          fonts: true
          cmd: ["./src/app.py"]
          install_project: false

    - name: amazhist-python
      path: ~/github/amazhist-python
      ci:
          template: library
          smoke_config: amazhist.yaml
          smoke_command: amazhist
          extra_artifacts:
              - data/debug/**
      configs:
          - dockerfile
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      docker:
          template: standard
          app_name: amazhist
          chrome: true
          fonts: true
          cmd: ["amazhist"]

    - name: amazon-bot
      path: ~/github/amazon-bot
      configs:
          - dockerfile
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: docker
          pyright_target: ""
          extra_artifacts:
              - data/debug/**
          config_script:
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/bot-config.git
              - mv bot-config/amazon-bot.yaml config.yaml
              - mv bot-config/amazon-bot-target.yaml target.yaml
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/font.git private_font
              - mv private_font/* font
          webui_run:
              # テスト用のダミーメトリクス DB を作成
              - mkdir -p test_data/metrics
              - uv run python scripts/create_test_metrics_db.py -o test_data/metrics/metrics.db
              - |-
                  docker run --rm --detach=true --tty=true
                  --name ${CI_JOB_NAME}-${CI_JOB_ID} --label job=${CI_JOB_NAME}
                  --publish :5000
                  ${CI_REGISTRY_IMAGE}:${TAG} sleep infinity
              - docker exec ${CI_JOB_NAME}-${CI_JOB_ID} mkdir -p /opt/amazon-bot/data/metrics
              - docker cp test_data/metrics/metrics.db ${CI_JOB_NAME}-${CI_JOB_ID}:/opt/amazon-bot/data/metrics/
              # CI は root 実行のため webui (ubuntu) が書けるよう所有者を合わせる
              - |-
                  docker exec -u root ${CI_JOB_NAME}-${CI_JOB_ID}
                  chown ubuntu:ubuntu /opt/amazon-bot/data/metrics/metrics.db
              - docker exec --detach ${CI_JOB_NAME}-${CI_JOB_ID} uv run amazon-vine-webui
          webui_health_path: /metrics
          extra_test_jobs:
              - test-dry-run
              - test-docker
          include_local: true
          deploy_script:
              - kubectl config use-context kimata/amazon-bot:pod-rollout
              - kubectl -n bot set image deployment/amazon-bot amazon-bot=${IMAGE}
              - kubectl -n bot rollout status deployment/amazon-bot --timeout=300s
      docker:
          template: standard
          chrome: true
          # NOTE: Chrome 143 でレンダラープロセスが約20分後に切断される問題があるため固定
          chrome_version: "142.0.7444.175-1"
          fonts: true
          extra_apt:
              - smem
          extra_mkdir:
              - data/chrome
          cmd: ["amazon-vine"]

    - name: eink-weather-panel
      path: ~/github/eink-weather-panel
      configs:
          - dockerfile
      docker:
          template: standard
          chrome: true
          fonts: true
          cjk_fonts: false
          cmd: ["src/display_image.py"]
          compile_bytecode: true

    - name: unit-cooler
      path: ~/github/unit-cooler
      configs:
          - dockerfile
      docker:
          template: hardware
          app_name: unit_cooler
          python_version: "3.12"
          lgpio: true
          expose:
              - 2222
              - 5000
              - 5001
          cmd: ["./src/controller.py"]

    - name: rasp-shutter
      path: ~/github/rasp-shutter
      configs:
          - dockerfile
      docker:
          template: hardware
          dev_deps: true
          expose:
              - 5000
          cmd: ["./src/app.py"]
      pyproject:
          preserve_fields:
              - requires-python # 3.12 指定を維持

    - name: modes-sensing
      path: ~/github/modes-sensing
      configs:
          - dockerfile
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: docker
          pyright_target: ""
          pytest_args: tests/unit
          pytest_config_script: false
          config_script:
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/sense-config.git
              - mv sense-config/sense-modes.yaml config.yaml
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/font.git private_font
              - mv private_font/* font
          extra_test_jobs:
              - test-playwright
              - test-docker
              - test-playwright-docker
          include_local: true
          deploy_script:
              - kubectl config use-context kimata/modes-sensing:pod-rollout
              - kubectl -n sensor set image deployment/modes-sensing-collector modes-sensing-collector=${IMAGE}
              - kubectl -n sensor set image deployment/modes-sensing-webui modes-sensing-webui=${IMAGE}
              - kubectl -n sensor rollout status deployment/modes-sensing-collector --timeout=300s
              - kubectl -n sensor rollout status deployment/modes-sensing-webui --timeout=300s
      docker:
          template: hardware
          dev_deps: true
          extra_env:
              # gitpython がインストールされていない環境でもエラーを抑制
              GIT_PYTHON_REFRESH: quiet
              # amdar パッケージのインポートを可能にする
              PYTHONPATH: /opt/modes-sensing/src
          expose:
              - 5000
          cmd: ["python", "-m", "amdar"]

    - name: server-list
      path: ~/github/server-list
      configs:
          - dockerfile
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: docker
          pyright_target: ""
          config_script:
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/panel-config.git
              - mv panel-config/server-list.yaml config.yaml
              - mv panel-config/server-list-secret.yaml secret.yaml
          webui_run:
              - >
                  docker run --rm --detach=true --tty=true
                  --name ${CI_JOB_NAME}-${CI_JOB_ID} --label job=${CI_JOB_NAME}
                  --publish :5000
                  ${CI_REGISTRY_IMAGE}:${TAG} server-list-webui
          webui_health_path: /server-list/api/config
          deploy_script:
              - kubectl config use-context kimata/server-list:pod-rollout
              - kubectl -n panel set image deployment/server-list server-list=${IMAGE}
              - kubectl -n panel rollout status deployment/server-list --timeout=300s
      docker:
          template: standard
          cjk_fonts: false
          expose:
              - 5000
          cmd: ["server-list-webui"]

    - name: rsudp
      path: ~/github/rsudp
      configs:
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: docker
          pyright_target: ""
          pytest_config_script: false
          config_script:
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/sense-config.git
              - mv sense-config/sense-rsudp.yaml config.yaml
              - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.green-rabbit.net/kimata/font.git private_font
              - mv private_font/* font
          webui_run:
              - |-
                  docker run --rm --detach=true --tty=true
                  --name ${CI_JOB_NAME}-${CI_JOB_ID} --label job=${CI_JOB_NAME}
                  --publish :5000
                  ${CI_REGISTRY_IMAGE}:${TAG} sleep infinity
              - |-
                  docker exec --detach --workdir /opt/rsudp/webui ${CI_JOB_NAME}-${CI_JOB_ID}
                  sh -c ".venv/bin/rsudp-webui > /tmp/flask.log 2>&1"
          webui_health_path: /rsudp/api/screenshot/
          deploy_script:
              - kubectl config use-context kimata/rsudp:pod-rollout
              - kubectl -n sensor set image deployment/rsudp rsudp=${IMAGE}
              - kubectl -n sensor set image deployment/rsudp-webui rsudp-webui=${IMAGE}
              - kubectl -n sensor rollout status deployment/rsudp --timeout=300s
              - kubectl -n sensor rollout status deployment/rsudp-webui --timeout=300s

    - name: dupdel
      path: ~/github/dupdel
      configs:
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: library
          pyright_target: ""
          pytest_env_ja: true
          pytest_args: "tests/test_core.py tests/test_cache.py"

    - name: py-project
      path: ~/github/py-project
      configs:
          - gitlab-ci-gen
      exclude_configs:
          - gitlab-ci
      ci:
          template: library
          ty: false # 既存の ty 診断 74 件が未解消のため
      gitignore:
          extra_lines:
              - "!config.yaml"
              - "!templates/**/*.yaml"
              - "!doc/**/*.md"
