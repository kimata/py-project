<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#fcfcfb"/>

  <!-- 入力 -->
  <rect x="20" y="50" width="180" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="110" y="76" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="600">config.yaml</text>
  <text x="110" y="96" text-anchor="middle" fill="#898781" font-size="11">JSON Schema 検証 (my_lib)</text>

  <rect x="20" y="140" width="180" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="110" y="166" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="600">templates/</text>
  <text x="110" y="186" text-anchor="middle" fill="#898781" font-size="11">Jinja2 テンプレート</text>

  <!-- CLI -->
  <rect x="270" y="80" width="150" height="70" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <text x="345" y="108" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="600">cli.py</text>
  <text x="345" y="128" text-anchor="middle" fill="#898781" font-size="11">docopt / エントリポイント</text>

  <!-- applier -->
  <rect x="490" y="50" width="200" height="130" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="2"/>
  <text x="590" y="78" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="600">applier.py</text>
  <text x="590" y="104" text-anchor="middle" fill="#52514e" font-size="11">プロジェクト × 設定タイプの適用ループ</text>
  <text x="590" y="128" text-anchor="middle" fill="#52514e" font-size="11">git stash / commit / push・uv sync</text>
  <text x="590" y="152" text-anchor="middle" fill="#52514e" font-size="11">サマリ表示 (rich)</text>

  <!-- dep_updater -->
  <rect x="270" y="210" width="150" height="66" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <text x="345" y="236" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="600">dep_updater.py</text>
  <text x="345" y="256" text-anchor="middle" fill="#898781" font-size="11">--update-deps</text>

  <!-- handlers -->
  <rect x="490" y="230" width="200" height="180" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
  <text x="590" y="256" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="600">handlers/（12 種）</text>
  <text x="590" y="280" text-anchor="middle" fill="#52514e" font-size="11">TemplateCopyHandler 系 ×9</text>
  <text x="590" y="298" text-anchor="middle" fill="#898781" font-size="10.5">pre-commit, ruff, yamllint, prettier,</text>
  <text x="590" y="314" text-anchor="middle" fill="#898781" font-size="10.5">python-version, gitignore, dockerignore,</text>
  <text x="590" y="330" text-anchor="middle" fill="#898781" font-size="10.5">renovate, license</text>
  <text x="590" y="354" text-anchor="middle" fill="#52514e" font-size="11">pyproject（tomlkit マージ）</text>
  <text x="590" y="374" text-anchor="middle" fill="#52514e" font-size="11">my-py-lib（コミットハッシュ更新）</text>
  <text x="590" y="394" text-anchor="middle" fill="#52514e" font-size="11">gitlab-ci（yamlpath 編集）</text>

  <!-- 対象プロジェクト -->
  <rect x="760" y="66" width="170" height="100" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <rect x="768" y="58" width="170" height="100" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <rect x="776" y="50" width="170" height="100" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="861" y="78" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="600">管理対象プロジェクト</text>
  <text x="861" y="100" text-anchor="middle" fill="#898781" font-size="11">config.yaml の projects[]</text>
  <text x="861" y="120" text-anchor="middle" fill="#52514e" font-size="11">設定ファイル書き込み</text>
  <text x="861" y="140" text-anchor="middle" fill="#52514e" font-size="11">git commit &amp; push（任意）</text>

  <!-- 外部システム -->
  <rect x="270" y="330" width="150" height="56" rx="8" fill="#ffffff" stroke="#eda100" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="345" y="353" text-anchor="middle" fill="#0b0b0b" font-size="12" font-weight="600">PyPI JSON API</text>
  <text x="345" y="372" text-anchor="middle" fill="#898781" font-size="10.5">最新バージョン取得</text>

  <rect x="270" y="410" width="150" height="56" rx="8" fill="#ffffff" stroke="#eda100" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="345" y="433" text-anchor="middle" fill="#0b0b0b" font-size="12" font-weight="600">GitHub</text>
  <text x="345" y="452" text-anchor="middle" fill="#898781" font-size="10.5">git ls-remote (my-py-lib)</text>

  <rect x="760" y="230" width="170" height="120" rx="8" fill="#ffffff" stroke="#eda100" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="845" y="256" text-anchor="middle" fill="#0b0b0b" font-size="12" font-weight="600">subprocess</text>
  <text x="845" y="280" text-anchor="middle" fill="#52514e" font-size="11">git stash / pop</text>
  <text x="845" y="300" text-anchor="middle" fill="#52514e" font-size="11">git add / commit / push</text>
  <text x="845" y="320" text-anchor="middle" fill="#52514e" font-size="11">uv sync</text>
  <text x="845" y="340" text-anchor="middle" fill="#898781" font-size="10.5">タイムアウト・リトライ制御付き</text>

  <!-- 矢印 -->
  <line x1="200" y1="90" x2="270" y2="105" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="170" x2="490" y2="300" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="115" x2="490" y2="115" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="150" x2="345" y2="210" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="180" x2="590" y2="230" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="110" x2="760" y2="110" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="320" x2="776" y2="140" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="276" x2="345" y2="330" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="384" x2="420" y2="430" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="160" x2="760" y2="250" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="700" y="100" fill="#898781" font-size="10.5">書込</text>
  <text x="360" y="196" fill="#898781" font-size="10.5">--update-deps</text>
  <text x="600" y="210" fill="#898781" font-size="10.5">HANDLERS レジストリ</text>
</svg>
