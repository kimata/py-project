<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="tri" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#fcfcfb"/>

  <text x="450" y="28" text-anchor="middle" fill="#0b0b0b" font-size="14" font-weight="700">ハンドラのクラス階層（白抜き矢印: 継承）</text>

  <!-- ConfigHandler -->
  <rect x="300" y="50" width="300" height="120" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="2"/>
  <text x="450" y="74" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="700">ConfigHandler（ABC / base.py）</text>
  <line x1="315" y1="84" x2="585" y2="84" stroke="#e1e0d9" stroke-width="1"/>
  <text x="315" y="102" fill="#52514e" font-size="11">抽象: name / apply() / diff() / get_output_path()</text>
  <text x="315" y="120" fill="#52514e" font-size="11">共通: validate()（format_type 別の構文検証）</text>
  <text x="315" y="138" fill="#52514e" font-size="11">共通: generate_diff()（difflib unified_diff）</text>
  <text x="315" y="156" fill="#52514e" font-size="11">共通: create_backup()（.bak 作成）</text>

  <!-- TemplateCopyHandler -->
  <rect x="40" y="230" width="300" height="100" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
  <text x="190" y="254" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="700">TemplateCopyHandler</text>
  <line x1="55" y1="264" x2="325" y2="264" stroke="#e1e0d9" stroke-width="1"/>
  <text x="55" y="282" fill="#52514e" font-size="11">Jinja2 レンダリング → 出力ファイルへコピー</text>
  <text x="55" y="300" fill="#52514e" font-size="11">vars = defaults.vars + project.vars（project 優先）</text>
  <text x="55" y="318" fill="#52514e" font-size="11">template_overrides によるテンプレート差し替え対応</text>

  <!-- 単純コピー系 -->
  <rect x="40" y="380" width="140" height="120" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="110" y="402" text-anchor="middle" fill="#0b0b0b" font-size="12" font-weight="600">単純コピー ×5</text>
  <text x="110" y="422" text-anchor="middle" fill="#52514e" font-size="10.5">PreCommitHandler</text>
  <text x="110" y="438" text-anchor="middle" fill="#52514e" font-size="10.5">RuffHandler</text>
  <text x="110" y="454" text-anchor="middle" fill="#52514e" font-size="10.5">YamllintHandler</text>
  <text x="110" y="470" text-anchor="middle" fill="#52514e" font-size="10.5">PrettierHandler</text>
  <text x="110" y="486" text-anchor="middle" fill="#52514e" font-size="10.5">PythonVersionHandler</text>

  <!-- IgnoreFileHandler -->
  <rect x="200" y="380" width="160" height="120" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="280" y="402" text-anchor="middle" fill="#0b0b0b" font-size="12" font-weight="600">IgnoreFileHandler</text>
  <text x="280" y="420" text-anchor="middle" fill="#898781" font-size="10.5">extra_lines を末尾に追加</text>
  <line x1="212" y1="430" x2="348" y2="430" stroke="#e1e0d9" stroke-width="1"/>
  <text x="280" y="450" text-anchor="middle" fill="#52514e" font-size="10.5">GitignoreHandler</text>
  <text x="280" y="466" text-anchor="middle" fill="#52514e" font-size="10.5">DockerignoreHandler</text>

  <!-- その他 template 系 -->
  <rect x="380" y="380" width="160" height="120" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="460" y="402" text-anchor="middle" fill="#0b0b0b" font-size="12" font-weight="600">特殊コピー</text>
  <text x="460" y="426" text-anchor="middle" fill="#52514e" font-size="10.5">RenovateHandler</text>
  <text x="460" y="450" text-anchor="middle" fill="#52514e" font-size="10.5">LicenseHandler</text>
  <text x="460" y="468" text-anchor="middle" fill="#898781" font-size="10">license.type で</text>
  <text x="460" y="482" text-anchor="middle" fill="#898781" font-size="10">テンプレートを選択</text>

  <!-- PyprojectHandler -->
  <rect x="400" y="230" width="150" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="475" y="254" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="700">PyprojectHandler</text>
  <text x="475" y="276" text-anchor="middle" fill="#52514e" font-size="10.5">tomlkit で既存ファイルと</text>
  <text x="475" y="292" text-anchor="middle" fill="#52514e" font-size="10.5">テンプレートをマージ</text>
  <text x="475" y="308" text-anchor="middle" fill="#52514e" font-size="10.5">セクション並び替え</text>

  <!-- MyPyLibHandler -->
  <rect x="570" y="230" width="150" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="645" y="254" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="700">MyPyLibHandler</text>
  <text x="645" y="276" text-anchor="middle" fill="#52514e" font-size="10.5">git ls-remote で最新</text>
  <text x="645" y="292" text-anchor="middle" fill="#52514e" font-size="10.5">ハッシュを取得し</text>
  <text x="645" y="308" text-anchor="middle" fill="#52514e" font-size="10.5">正規表現で置換</text>

  <!-- GitLabCIHandler -->
  <rect x="740" y="230" width="150" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="815" y="254" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="700">GitLabCIHandler</text>
  <text x="815" y="276" text-anchor="middle" fill="#52514e" font-size="10.5">ruamel.yaml で行番号を</text>
  <text x="815" y="292" text-anchor="middle" fill="#52514e" font-size="10.5">特定し、行単位の文字列</text>
  <text x="815" y="308" text-anchor="middle" fill="#52514e" font-size="10.5">置換（書式を完全保持）</text>

  <!-- 継承線 -->
  <line x1="190" y1="230" x2="380" y2="172" stroke="#52514e" stroke-width="1.5" marker-end="url(#tri)"/>
  <line x1="475" y1="230" x2="460" y2="172" stroke="#52514e" stroke-width="1.5" marker-end="url(#tri)"/>
  <line x1="645" y1="230" x2="530" y2="172" stroke="#52514e" stroke-width="1.5" marker-end="url(#tri)"/>
  <line x1="815" y1="230" x2="600" y2="160" stroke="#52514e" stroke-width="1.5" marker-end="url(#tri)"/>
  <line x1="110" y1="380" x2="150" y2="332" stroke="#52514e" stroke-width="1.5" marker-end="url(#tri)"/>
  <line x1="280" y1="380" x2="230" y2="332" stroke="#52514e" stroke-width="1.5" marker-end="url(#tri)"/>
  <line x1="440" y1="380" x2="300" y2="325" stroke="#52514e" stroke-width="1.5" marker-end="url(#tri)"/>
</svg>
