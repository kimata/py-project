<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="440" fill="#fcfcfb"/>

  <text x="430" y="28" text-anchor="middle" fill="#0b0b0b" font-size="14" font-weight="700">モジュール依存関係（矢印: import する方向）</text>

  <!-- __main__ -->
  <rect x="40" y="60" width="140" height="44" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="110" y="87" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="600">__main__.py</text>

  <!-- cli -->
  <rect x="250" y="60" width="140" height="44" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="320" y="87" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="600">cli.py</text>

  <!-- applier -->
  <rect x="480" y="60" width="140" height="44" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="2"/>
  <text x="550" y="87" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="600">applier.py</text>

  <!-- differ -->
  <rect x="690" y="60" width="130" height="44" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="755" y="87" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="600">differ.py</text>

  <!-- dep_updater -->
  <rect x="250" y="170" width="140" height="44" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="320" y="197" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="600">dep_updater.py</text>

  <!-- handlers pkg -->
  <rect x="480" y="160" width="200" height="130" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
  <text x="580" y="184" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="600">handlers/</text>
  <text x="580" y="206" text-anchor="middle" fill="#52514e" font-size="11">__init__.py（HANDLERS）</text>
  <text x="580" y="226" text-anchor="middle" fill="#52514e" font-size="11">template_copy.py / pyproject.py</text>
  <text x="580" y="246" text-anchor="middle" fill="#52514e" font-size="11">my_py_lib.py / gitlab_ci.py</text>
  <text x="580" y="272" text-anchor="middle" fill="#52514e" font-size="11">base.py（ConfigHandler 基底）</text>

  <!-- config -->
  <rect x="480" y="340" width="200" height="44" rx="8" fill="#ffffff" stroke="#eda100" stroke-width="2"/>
  <text x="580" y="367" text-anchor="middle" fill="#0b0b0b" font-size="12.5" font-weight="600">config.py（dataclass 定義）</text>

  <!-- my_lib -->
  <rect x="40" y="340" width="350" height="44" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="215" y="360" text-anchor="middle" fill="#0b0b0b" font-size="12" font-weight="600">my_lib（外部）</text>
  <text x="215" y="377" text-anchor="middle" fill="#898781" font-size="10.5">config 読み込み / logger / cui_progress</text>

  <!-- 矢印 -->
  <line x1="180" y1="82" x2="250" y2="82" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="82" x2="480" y2="82" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="82" x2="690" y2="82" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- cli -> dep_updater -->
  <line x1="320" y1="104" x2="320" y2="170" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- cli -> handlers -->
  <line x1="390" y1="100" x2="480" y2="180" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- cli -> config -->
  <path d="M 300 104 C 300 300 420 358 480 358" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- applier -> handlers -->
  <line x1="550" y1="104" x2="565" y2="160" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- applier -> config -->
  <path d="M 620 100 C 720 160 720 300 680 348" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- dep_updater -> applier (TargetList) -->
  <line x1="390" y1="178" x2="490" y2="102" stroke="#e34948" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="140" fill="#e34948" font-size="10.5">TargetList のみ参照</text>
  <!-- dep_updater -> config -->
  <line x1="390" y1="205" x2="480" y2="345" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- handlers -> config -->
  <line x1="580" y1="290" x2="580" y2="340" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- cli/applier -> my_lib -->
  <line x1="270" y1="104" x2="220" y2="340" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="640" y="320" fill="#898781" font-size="10.5">handlers 内は base.py を</text>
  <text x="640" y="336" fill="#898781" font-size="10.5">handlers_base として参照</text>
</svg>
